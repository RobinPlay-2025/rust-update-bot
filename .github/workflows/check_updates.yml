name: RustPulse — Check Updates

on:
  schedule:
    # Каждые 30 минут
    - cron: '*/30 * * * *'
  # Ручной запуск для тестирования
  workflow_dispatch:

permissions:
  contents: write   # нужно для git commit last_versions.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RustPulse
        env:
          LOLKA_TOKEN:          ${{ secrets.LOLKA_TOKEN }}
          CHANNEL_RUST_SERVER:  ${{ secrets.CHANNEL_RUST_SERVER }}
          CHANNEL_RUST_CLIENT:  ${{ secrets.CHANNEL_RUST_CLIENT }}
          CHANNEL_OXIDE:        ${{ secrets.CHANNEL_OXIDE }}
          CHANNEL_CARBON:       ${{ secrets.CHANNEL_CARBON }}
          CHANNEL_HOOKS:        ${{ secrets.CHANNEL_HOOKS }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py

      - name: Commit updated versions
        run: |
          git config --local user.email "rustpulse-bot@users.noreply.github.com"
          git config --local user.name "RustPulse Bot"
          git add last_versions.json
          git diff --staged --quiet || git commit -m "chore: update versions [skip ci]"
          git push
