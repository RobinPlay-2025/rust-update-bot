name: RustPulse — Check Updates

on:
  schedule:
    # Запуск каждые 5 часов. GitHub Actions убивает процессы через 6 часов.
    # concurrency автоматически убьет старый процесс при запуске нового.
    - cron: '0 */5 * * *'
  # Ручной запуск для тестирования
  workflow_dispatch:

permissions:
  contents: write   # нужно для git commit last_versions.json

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: rustpulse-bot
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RustPulse
        env:
          LOLKA_TOKEN:          ${{ secrets.LOLKA_TOKEN }}
          CHANNEL_RUST_SERVER:  ${{ secrets.CHANNEL_RUST_SERVER }}
          CHANNEL_RUST_CLIENT:  ${{ secrets.CHANNEL_RUST_CLIENT }}
          CHANNEL_OXIDE:        ${{ secrets.CHANNEL_OXIDE }}
          CHANNEL_CARBON:       ${{ secrets.CHANNEL_CARBON }}
          CHANNEL_HOOKS:        ${{ secrets.CHANNEL_HOOKS }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py
